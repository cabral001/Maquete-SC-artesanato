<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maquete Interativa - WebAR</title>
  
  <!-- SCRIPT DE INTERCEÇÃO: Força a câmara a rodar em HD (720p) -->
  <script>
    const originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
    navigator.mediaDevices.getUserMedia = function(constraints) {
      if (constraints && constraints.video) {
        if (typeof constraints.video === 'object') {
          constraints.video.width = { ideal: 1280 };
          constraints.video.height = { ideal: 720 };
        }
      }
      return originalGetUserMedia(constraints);
    };
  </script>

  <!-- Importando A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #loading-message {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: sans-serif;
      z-index: 999;
      pointer-events: none;
    }

    /* ESTILO DO BALÃO HTML FLUTUANTE */
    .ar-balloon {
      background: rgba(255, 255, 255, 0.95);
      color: #333;
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      font-family: sans-serif;
      width: 220px;
      text-align: left;
      border-left: 5px solid #2196F3;
      transform: translate(-50%, -100%); /* Centraliza acima do ponto de origem */
    }
    .ar-balloon h3 {
      margin: 0 0 6px 0;
      font-size: 15px;
      color: #111;
    }
    .ar-balloon p {
      margin: 0;
      font-size: 12px;
      line-height: 1.4;
      color: #555;
    }
  </style>
</head>
<body>

  <div id="loading-message">Aponte a câmara para as imagens de referência...</div>

  <!-- Cena A-Frame com suporte a HTML UI do MindAR -->
  <a-scene 
    mindar-image="imageTargetSrc: targets.mind; maxTrack: 4;" 
    embedded
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; highRefreshRate: true; precision: high;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Pré-carregando os modelos 3D (.glb) -->
      <a-asset-item id="model-jazida" src="jazida.glb"></a-asset-item>
      <a-asset-item id="model-producao" src="producao.glb"></a-asset-item>
      <a-asset-item id="model-feirapessoas" src="feirapessoas.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- ALVO 0: imagem1.jpeg -> jazida.glb (Com o atributo mindar-image-target associado ao HTML via slot) -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model 
        src="#model-jazida" 
        position="0 0 0" 
        scale="10 10 10" 
        rotation="0 0 0">
      </a-gltf-model>
    </a-entity>

    <!-- ALVO 1: imagem2.jpeg -> producao.glb -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model 
        src="#model-producao" 
        position="0 0 0" 
        scale="10 10 10" 
        rotation="0 0 0">
      </a-gltf-model>
    </a-entity>

    <!-- ALVO 2: imagem3.jpeg -> Texto provisório -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-text 
        value="Conteudo em breve..." 
        align="center" 
        position="0 0 0" 
        scale="10 10 10" 
        color="#FFD700">
      </a-text>
    </a-entity>

    <!-- ALVO 3: imagem4.jpeg -> feirapessoas.glb -->
    <a-entity mindar-image-target="targetIndex: 3">
      <a-gltf-model 
        src="#model-feirapessoas" 
        position="0 0 0" 
        scale="10 10 10" 
        rotation="0 0 0">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <!-- BALÕES HTML DO MINDAR (Devem ficar fora da a-scene, vinculados por targetIndex) -->
  <div slot="targetIndex: 0" class="ar-balloon">
    <h3>Jazida e Extração de Argila</h3>
    <p>Ponto de origem onde o barro é extraído da natureza nas margens de rios e encostas.</p>
  </div>

</body>
</html>
