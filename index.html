<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Maquete Interativa - WebAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    /* Altura real controlada via JS (var --app-height), evitando o vão
       causado pela barra de endereço do navegador no celular */
    #app-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: var(--app-height, 100vh);
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    /* Nenhum CSS customizado em video/canvas: o MindAR já cuida disso sozinho */

    #status-message {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 14px;
      z-index: 999;
      max-width: 85%;
      text-align: center;
    }

    .ar-balloon {
      display: none;
      position: fixed;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      color: #333;
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      font-family: sans-serif;
      width: 220px;
      text-align: left;
      border-left: 5px solid #2196F3;
      z-index: 998;
    }
    .ar-balloon h3 { margin: 0 0 6px 0; font-size: 15px; color: #111; }
    .ar-balloon p { margin: 0; font-size: 12px; line-height: 1.4; color: #555; }
  </style>
</head>
<body>

  <div id="status-message">Verificando câmera...</div>

  <div id="balloon-0" class="ar-balloon">
    <h3>Jazida e Extração de Argila</h3>
    <p>Ponto de origem onde o barro é extraído da natureza nas margens de rios e encostas.</p>
  </div>

  <div id="app-container">
    <a-scene
      mindar-image="imageTargetSrc: targets.mind; maxTrack: 4;"
      embedded
      renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <a-asset-item id="model-jazida" src="jazida.glb"></a-asset-item>
        <a-asset-item id="model-producao" src="producao.glb"></a-asset-item>
        <a-asset-item id="model-feirapessoas" src="feirapessoas.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target-0" mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#model-jazida" position="0 0 0" scale="3 3 3" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <a-entity id="target-1" mindar-image-target="targetIndex: 1">
        <a-gltf-model src="#model-producao" position="0 0 0" scale="3 3 3" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <a-entity id="target-2" mindar-image-target="targetIndex: 2">
        <a-text value="Conteudo em breve..." align="center" position="0 0 0" scale="1 1 1" color="#FFD700"></a-text>
      </a-entity>

      <a-entity id="target-3" mindar-image-target="targetIndex: 3">
        <a-gltf-model src="#model-feirapessoas" position="0 0 0" scale="3 3 3" rotation="90 0 0"></a-gltf-model>
      </a-entity>
      <a-entity light="type: ambient; color: #FFF; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="1 2 1"></a-entity>
    </a-scene>
  </div>

  <script>
    // Corrige a altura real da viewport no celular (problema do 100vh com a barra de endereço)
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
    }
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
    setAppHeight();

    const statusEl = document.getElementById('status-message');

    const target0 = document.getElementById('target-0');
    const balloon0 = document.getElementById('balloon-0');
    target0.addEventListener('targetFound', () => { balloon0.style.display = 'block'; });
    target0.addEventListener('targetLost', () => { balloon0.style.display = 'none'; });

    // Log de carregamento dos modelos, para diagnosticar se os .glb estão sendo encontrados
    document.querySelectorAll('a-asset-item').forEach(item => {
      item.addEventListener('loaded', () => console.log('Carregado:', item.id));
      item.addEventListener('error', (e) => console.error('Erro ao carregar:', item.id, e));
    });

    async function checkCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusEl.textContent = 'Este navegador não suporta câmera (ou a página não está em HTTPS).';
        return;
      }

      const videoConstraints720p = { width: { ideal: 1280 }, height: { ideal: 720 } };

      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const hasCamera = devices.some(d => d.kind === 'videoinput');

        if (!hasCamera) {
          statusEl.textContent = 'Nenhuma câmera encontrada neste dispositivo. Abra esta página no celular.';
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' }, ...videoConstraints720p }
          });
          stream.getTracks().forEach(t => t.stop());
          statusEl.textContent = 'Aponte a câmera para as imagens de referência...';
        } catch (e1) {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: videoConstraints720p
          });
          stream.getTracks().forEach(t => t.stop());
          statusEl.textContent = 'Aponte a câmera para as imagens de referência...';
        }

      } catch (err) {
        if (err.name === 'NotAllowedError') {
          statusEl.textContent = 'Permissão de câmera negada. Libere o acesso no ícone de cadeado do navegador.';
        } else if (err.name === 'NotFoundError') {
          statusEl.textContent = 'Nenhuma câmera encontrada. Abra esta página no celular.';
        } else if (err.name === 'NotReadableError') {
          statusEl.textContent = 'A câmera está sendo usada por outro aplicativo.';
        } else {
          statusEl.textContent = 'Erro ao acessar a câmera: ' + err.message;
        }
      }
    }

    checkCamera();
  </script>

</body>
</html>
